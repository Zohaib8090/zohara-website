<!doctype html>
<html lang="en">
<head>

  <title>Page not found · Zohara OS</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <!-- Self-contained on purpose: a 404 page is served from whatever path was mistyped, on whichever host

  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px;
           background: #0B0E14; color: #E8ECF1; font: 400 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
    svg { margin-inline: auto; }
    h1 { font-size: 2.2rem; line-height: 1.15; margin: 0; }
    p { margin: 0 auto; color: #a3aebf; }
    a.btn { display: inline-block; margin-top: 8px; background: #5FD4D4; color: #062b2d; font-weight: 700; text-decoration: none;
            padding: 13px 22px; border-radius: 999px; }
    a.btn:hover { background: #8ee6e6; }
    a.btn:focus-visible { outline: 3px solid #5FD4D4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" viewBox="0 0 340 340" role="img" aria-label="Zohara OS logo" xmlns="http://www.w3.org/2000/svg">
      <rect width="340" height="340" rx="64" fill="#0B0E14"/>
      <g transform="translate(170,170) rotate(45)">
        <rect x="-86" y="-86" width="78" height="78" rx="14" fill="#E8ECF1"/>
        <rect x="8" y="-86" width="78" height="78" rx="14" fill="#E8ECF1" opacity="0.55"/>
        <rect x="-86" y="8" width="78" height="78" rx="14" fill="#E8ECF1" opacity="0.55"/>
        <rect x="8" y="8" width="78" height="78" rx="14" fill="#5FD4D4"/>
      </g>
    </svg>
    <h1>That page isn't here.</h1>
    <p>The link may be old, or mistyped.</p>
    <p><a class="btn" href="https://zohara-website.onrender.com/">Back to Zohara OS</a></p>
  </main>
</body>
</html>
